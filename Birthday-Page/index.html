<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>致我的宝宝｜生日快乐🎂</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      /* 使用本地图片 Pic1.jpg 作为背景 */
      background: url('Pic1.jpg') center/cover no-repeat;
      background-attachment: fixed;
      background-color: #000;
      overflow: hidden;
    }

    .page::after{
      content:'';
      position:absolute;
      left:0;top:0;
      width:100%;height:100%;
      background:rgba(255,240,245,0.25);
    }

    .light-spot {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 180, 200, 0.25);
      filter: blur(30px);
      animation: lightMove 8s ease-in-out infinite;
      z-index:1;
    }
    @keyframes lightMove {
      0%,100%{transform: translate(0,0) scale(1);}
      50%{transform: translate(20px,-20px) scale(1.1);}
    }

    .start-tip {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      transition: all 0.6s ease;
      gap: 12px;
    }

    .start-tip p {
      color: #ff5a8c;
      font-size: 18px;
      background: rgba(255,255,255,0.75);
      padding: 14px 30px;
      border-radius: 50px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    .start-tip.hide {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.1);
    }

    .card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 88%;
      max-width: 400px;
      max-height: 75vh;
      background: #ffffff;
      border-radius: 28px;
      padding: 30px 22px;
      box-shadow: 0 12px 45px rgba(255, 120, 168, 0.25);
      text-align: center;
      overflow-y: auto;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.85);
      transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
      z-index:10;
    }

    .card.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .card::-webkit-scrollbar {
      width: 3px;
    }
    .card::-webkit-scrollbar-thumb {
      background: #ff85a2;
      border-radius: 10px;
    }

    .cake {
      width: 85px;
      margin: 0 auto 15px;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 12px;
      display: block;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }
    .flame {
      animation: flame 0.8s ease-in-out infinite alternate;
      transform-origin: center bottom;
    }
    @keyframes flame {
      0%{transform: scaleY(1) scaleX(1);opacity:0.8;}
      100%{transform: scaleY(1.2) scaleX(0.9);opacity:1;}
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      color: #ff5a8c;
      margin-bottom: 8px;
      letter-spacing: 1px;
      animation: titleShine 2.5s ease-in-out infinite;
    }
    @keyframes titleShine {
      0%,100%{text-shadow: 0 0 8px rgba(255,90,140,0.4);}
      50%{text-shadow: 0 0 18px rgba(255,90,140,0.7),0 0 30px rgba(255,90,140,0.3);}
    }

    .date-title {
      font-size: 13px;
      color: #ff94b3;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .desc {
      font-size: 14px;
      color: #444;
      line-height: 2;
      text-align: justify;
      margin-bottom: 18px;
      white-space: pre-line;
    }

    .signature {
      font-size: 15px;
      color: #ff699b;
      font-style: italic;
      text-align: right;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .signature.show {
      opacity: 1;
    }

    .date-text {
      font-size: 12px;
      color: #bbb;
      text-align: right;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    .date-text.show {
      opacity: 1;
    }

    .balloon {
      position: absolute;
      width: 36px;
      height: 42px;
      border-radius: 20px 20px 4px 20px;
      animation: float 6s ease-in-out infinite;
      z-index:2;
    }
    .heart {
      position: absolute;
      font-size: 22px;
      opacity: 0.8;
      animation: fly 7s linear infinite;
      z-index:2;
    }
    .star {
      position: absolute;
      font-size: 14px;
      animation: sparkle 5s infinite alternate;
      z-index:2;
    }
    .firework {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(255,255,255,0.4);
      z-index:2;
    }

    @keyframes fireworkBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      80% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.4);
      }
    }

    @keyframes pulse {
      0%,100%{opacity:0.7;transform:scale(1);}
      50%{opacity:1;transform:scale(1.05);}
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-22px); }
      100% { transform: translateY(0); }
    }
    @keyframes fly {
      0% { transform: translateY(120vh) scale(0.7); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-200px) scale(1.2); opacity: 0; }
    }
    @keyframes sparkle {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
<div class="page" id="page">
  <div class="light-spot" style="width:180px;height:180px;top:10%;left:15%;"></div>
  <div class="light-spot" style="width:220px;height:220px;bottom:15%;right:10%;animation-delay:2s;"></div>

  <div class="start-tip" id="startTip">
    <p>💌 点击开启 我给宝宝的专属祝福</p>
  </div>

  <div class="card" id="cardBox">
    <svg class="cake" viewBox="0 0 200 200">
      <rect x="60" y="120" width="80" height="40" fill="#ffb6c1"/>
      <rect x="70" y="100" width="60" height="20" fill="#ffc0cb"/>
      <rect x="85" y="80" width="30" height="20" fill="#ffd6dc"/>
      <circle cx="100" cy="76" r="6" fill="#ff5577" class="flame"/>
      <circle cx="80" cy="96" r="4" fill="#fff"/>
      <circle cx="120" cy="96" r="4" fill="#fff"/>
      <circle cx="70" cy="116" r="4" fill="#fff"/>
      <circle cx="130" cy="116" r="4" fill="#fff"/>
    </svg>

    <img src="Pic2.jpg" alt="我的照片" class="avatar">

    <div class="title">生日快乐呀宝宝🎂</div>
    <div class="date-title">专属生辰 · 岁岁欢喜</div>

    <div class="desc" id="wishText"></div>

    <div class="signature" id="signText">永远爱你的我</div>
    <div class="date-text" id="dateText">岁岁年年 · 不离不弃</div>
  </div>
  <audio id="bgMusic" src="vid1.m4a" loop preload="auto"></audio>
</div>

<script>
  const page = document.getElementById('page');
  const startTip = document.getElementById('startTip');
  const cardBox = document.getElementById('cardBox');
  const wishText = document.getElementById('wishText');
  const signText = document.getElementById('signText');
  const dateText = document.getElementById('dateText');
  const bgMusic = document.getElementById('bgMusic');
  let isOpen = false;

  // 完整原歌词文案
  const fullText = `晚风把云朵揉成了棉花糖
晚霞落在你鼻尖轻轻发烫
心跳跟着呼吸慢慢摇晃
世界再吵，我只看向你脸庞
空气里都是甜甜的味道
每分每秒都想把你抓牢
你一靠近，所有烦恼都跑掉
我的快乐，从此被你承包
你是星光，也是暖阳
是我藏在心底的小愿望
是平淡生活里的糖
让所有温柔，都有了方向
有你就足够美好
所有温柔都给你，不多不少
不用长大，不用坚强
我会一直做你的避风港
有你就无比心安
往后余生只愿与你相伴
朝朝暮暮，岁岁年年
这份喜欢永远不会变淡
不用假装懂事也不用逞强
你可以永远依赖我的肩膀
所有小脾气我全都原谅
你只管可爱，做我的小太阳
把所有浪漫都摆到你面前
把所有偏爱都只给你一遍
你是我藏不住的心动和想念
是我一辈子最温柔的眷恋
你是星光，也是暖阳
是我藏在心底的小愿望
是平淡生活里的糖
让所有温柔，都有了方向
有你就足够美好
所有温柔都给你，不多不少
不用长大，不用坚强
我会一直做你的避风港
有你就无比心安
往后余生只愿与你相伴
朝朝暮暮，岁岁年年
这份喜欢永远不会变淡
从日出走到黄昏和星辰
从青涩走到安稳和认真
我会把你好好握紧不转身
让幸福永远为我们扎根
我想和你把平凡过成诗
把每个明天都写成故事
长路漫漫，心有归期
往后风景，只与你共赴`;

  // 生成简易混响，R&B必备氛围感
  // 乐器音频已移除，页面不再播放音乐

  // R&B完整编曲｜慢速抒情62BPM，主旋+贝斯根音+轻切分鼓
  // 音乐已移除，页面将只展示祝福贺卡内容。

  // 逐字打字
  function typeText(text, dom, speed = 35){
    let index = 0;
    dom.innerText = '';
    return new Promise(res=>{
      const timer = setInterval(()=>{
        if(index < text.length){
          dom.innerText += text[index];
          index++;
        }else{
          clearInterval(timer);
          res();
        }
      },speed);
    });
  }

  // 点击启动
  page.addEventListener('click',async ()=>{
    if(isOpen) return;
    isOpen = true;

    startTip.classList.add('hide');
    cardBox.classList.add('open');

    bgMusic.volume = 0.65;
    bgMusic.play().catch(()=>{});

    await typeText(fullText, wishText);
    signText.classList.add('show');
    dateText.classList.add('show');

    createBalloon();
    createHeart();
    createStar();
    startFirework();
  });

  // 气球
  function createBalloon(){
    const colors = ['#ff85a2','#72ddf7','#ffda77','#b67fff','#ff9bbb'];
    for(let i=0;i<12;i++){
      let b = document.createElement('div');
      b.className = 'balloon';
      b.style.cssText = `left:${Math.random()*90}%;bottom:${Math.random()*60}px;background:${colors[i%colors.length]};animation-delay:${Math.random()*4}s;`;
      page.appendChild(b);
    }
  }

  // 爱心
  function createHeart(){
    for(let i=0;i<20;i++){
      let h = document.createElement('div');
      h.className = 'heart';
      h.innerText = '❤️';
      h.style.cssText = `left:${Math.random()*100}%;animation-delay:${Math.random()*7}s;`;
      page.appendChild(h);
    }
  }

  // 星星
  function createStar(){
    for(let i=0;i<30;i++){
      let s = document.createElement('div');
      s.className = 'star';
      s.innerText = '⭐';
      s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;`;
      page.appendChild(s);
    }
  }

  // 烟花
  function startFirework(){
    setInterval(()=>{
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight * 0.7 + window.innerHeight * 0.1;
      const color = ['#ff85a2','#ffd6dc','#f3e5f5','#72ddf7','#ffda77'][Math.floor(Math.random()*5)];
      const count = 12 + Math.floor(Math.random()*8);
      for(let i=0;i<count;i++){
        const fw = document.createElement('div');
        fw.className = 'firework';
        const angle = Math.random() * Math.PI * 2;
        const distance = 60 + Math.random() * 80;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;
        const size = 6 + Math.random() * 8;
        fw.style.cssText = `
          left:${x}px;top:${y}px;
          width:${size}px;height:${size}px;
          background:${color};
          --dx:${dx}px;
          --dy:${dy}px;
          animation: fireworkBurst 1.2s ease-out forwards;
          box-shadow: 0 0 14px ${color}, 0 0 28px ${color};
        `;
        page.appendChild(fw);
        setTimeout(()=>fw.remove(), 1200);
      }
    }, 700);
  }
</script>
</body>
</html>
